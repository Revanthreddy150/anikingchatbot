<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANIKING HELPER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020202; --accent: #00f2ff; --bot: #111; --user: #004d4d; --glass: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header */
        .header { height: 75px; background: #080808; border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 10; }
        .logo h2 { font-family: 'Orbitron'; font-size: 0.85rem; color: var(--accent); margin: 0; letter-spacing: 1px; }
        .status { font-size: 0.6rem; color: #00ff00; display: flex; align-items: center; gap: 5px; margin-top: 3px; }
        .pulse-dot { width: 7px; height: 7px; background: #00ff00; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Profile Button Interaction */
        .profile-btn { display: flex; align-items: center; gap: 8px; background: var(--glass); padding: 6px 12px; border-radius: 20px; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .profile-btn:active { transform: scale(0.95); }
        .profile-btn img { width: 25px; height: 25px; border-radius: 50%; border: 1px solid var(--accent); }

        /* Chat Window */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: radial-gradient(circle at 50% 0%, #0a1114, #020202); }
        .msg { max-width: 85%; padding: 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.6; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        .bot { align-self: flex-start; background: var(--bot); border: 1px solid #222; border-left: 4px solid var(--accent); }
        .user { align-self: flex-end; background: var(--user); border: 1px solid var(--accent); border-bottom-right-radius: 2px; }

        /* Glassmorphism Profile Modal */
        #profile-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-card { width: 85%; max-width: 340px; background: rgba(17, 17, 17, 0.9); border: 1px solid var(--accent); border-radius: 25px; padding: 30px; text-align: center; box-shadow: 0 0 40px rgba(0, 242, 255, 0.15); }
        .modal-card img { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 15px; }
        .modal-card h3 { font-family: 'Orbitron'; color: var(--accent); margin: 5px 0; }
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 15px; border: 1px solid #222; }
        .stat-box small { font-size: 0.6rem; color: #888; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .stat-box span { font-size: 0.9rem; font-weight: bold; color: #fff; }

        /* Controls */
        .close-modal { margin-top: 25px; background: var(--accent); color: #000; border: none; padding: 12px 35px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; }

        .input-area { padding: 15px; background: #050505; border-top: 1px solid #222; display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        #u-input { flex: 1; background: #121212; border: 1px solid #333; padding: 14px 20px; border-radius: 30px; color: white; font-size: 1rem; }
        #send { background: var(--accent); border: none; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; color: black; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <h2>ANIKING HELPER</h2>
            <div class="status"><div class="pulse-dot"></div> LIVE RESULT: ACTIVE</div>
        </div>
        <div class="profile-btn" onclick="toggleModal(true)">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Holavpn">
            <span style="font-size:0.75rem; font-weight:700;">Holavpn</span>
        </div>
    </header>

    <main id="chat-window"></main>

    <footer class="input-area">
        <input type="text" id="u-input" placeholder="Ask me about anything..." autocomplete="off">
        <button id="send" onclick="handleChat()">➤</button>
    </footer>

    <div id="profile-modal">
        <div class="modal-card">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Holavpn">
            <h3>Holavpn</h3>
            <p style="font-size: 0.75rem; color: #00f2ff; margin-bottom: 20px;">Elite Member</p>
            
            <div class="stats-container">
                <div class="stat-box">
                    <small>Uptime</small>
                    <span id="timer-display">0m 0s</span>
                </div>
                <div class="stat-box">
                    <small>Queries</small>
                    <span id="query-count">0</span>
                </div>
                <div class="stat-box">
                    <small>Language</small>
                    <span>Multilingual</span>
                </div>
                <div class="stat-box">
                    <small>Access</small>
                    <span>Unlimited</span>
                </div>
            </div>
            
            <button class="close-modal" onclick="toggleModal(false)">BACK TO CHAT</button>
        </div>
    </div>

    <script>
        const win = document.getElementById('chat-window');
        const input = document.getElementById('u-input');
        let queryCount = 0;
        let startTime = Date.now();

        // Session Timer
        setInterval(() => {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            let m = Math.floor(elapsed / 60);
            let s = elapsed % 60;
            document.getElementById('timer-display').innerText = `${m}m ${s}s`;
        }, 1000);

        function toggleModal(show) {
            document.getElementById('profile-modal').style.display = show ? 'flex' : 'none';
        }

        function addMessage(text, side) {
            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        async function processAI(val) {
            queryCount++;
            document.getElementById('query-count').innerText = queryCount;
            const q = val.toLowerCase();

            return new Promise((resolve) => {
                setTimeout(() => {
                    if (q.includes("demon slayer") || q.includes("demo")) {
                        resolve(`**[DATA FETCHED]**: The **Infinity Castle Arc** is confirmed as a Movie Trilogy. Production by Ufotable is currently high-priority for 2026.`);
                    }
                    if (q.includes("solo leveling")) {
                        resolve(`**[STATUS]**: Solo Leveling S2 is currently leading global trends. The animation of the shadow army has reached new peaks.`);
                    }
                    if (q.includes("who made you")) {
                        resolve(`I am **ANIKING HELPER**, an advanced AI interface developed by **RR Networks** and powered by **ANIKING INDIA**.`);
                    }
                    if (q.includes("hi") || q.includes("hello")) {
                        resolve(`Hello **Holavpn**! I'm ready. What anime news or translations do you need today?`);
                    }
                    resolve(`Analyzing "**${val}**"... I'm currently scanning the global anime community for production leaks. Please stay tuned!`);
                }, 500);
            });
        }

        async function handleChat() {
            const val = input.value.trim();
            if(!val) return;
            addMessage(val, 'user');
            input.value = "";
            const reply = await processAI(val);
            addMessage(reply, 'bot');
        }

        input.onkeypress = (e) => { if(e.key === 'Enter') handleChat(); };
        addMessage("Hello **Holavpn**! How can I assist you today?", 'bot');
    </script>
</body>
</html>
