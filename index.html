<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIKING - AI Chat & Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 15, 0.98);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --bot-msg: #1a1a1a;
            --user-msg: #004d4d;
        }

        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark);
            margin: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column;
        }

        /* Chat Header */
        .chat-header {
            background: var(--card-bg); padding: 12px 15px; border-bottom: 1px solid var(--accent-cyan);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); z-index: 100;
        }

        .chat-header h2 { font-family: 'Orbitron'; font-size: 0.9rem; color: var(--accent-cyan); margin: 0; }

        /* Account Section in Header */
        .user-pill {
            display: flex; align-items: center; background: rgba(255,255,255,0.05);
            padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(0, 242, 255, 0.3);
            cursor: pointer; transition: 0.3s;
        }
        .user-pill:hover { background: rgba(0, 242, 255, 0.1); }
        .user-pill img { width: 24px; height: 24px; border-radius: 50%; margin-right: 8px; border: 1px solid var(--accent-cyan); }
        .user-pill span { font-size: 0.75rem; font-weight: bold; color: var(--accent-cyan); }

        /* Chat Window */
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            background: radial-gradient(circle at center, #0a1114 0%, #050505 100%);
        }

        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 0.9rem; line-height: 1.4; }
        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid #333; border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--user-msg); border: 1px solid var(--accent-cyan); border-bottom-right-radius: 2px; }

        /* Input Area */
        .input-area { padding: 15px; background: #0a0a0a; display: flex; gap: 10px; border-top: 1px solid #222; }
        #user-input { flex: 1; background: #151515; border: 1px solid #333; padding: 12px; border-radius: 25px; color: white; outline: none; }
        #send-btn { background: var(--accent-cyan); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .branding { font-size: 0.6rem; color: #444; text-align: center; padding: 5px; background: #000; }

        /* Account Overlay */
        #account-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #111; padding: 30px; border-radius: 15px; border: 1px solid var(--accent-cyan);
            text-align: center; width: 80%; max-width: 300px;
        }
        .modal-content img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent-cyan); margin-bottom: 15px; }
        .close-btn { margin-top: 20px; background: var(--accent-cyan); color: #000; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div class="chat-header">
        <div>
            <h2>ANIKING AI</h2>
        </div>
        
        <div class="user-pill" id="profile-trigger" onclick="toggleModal(true)">
            <img id="header-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky" alt="U">
            <span id="header-name">Loading...</span>
        </div>
    </div>

    <div id="chat-window">
        <div class="message bot">Hello! I am your ANIKING assistant. Since you are logged in, I can help you better!</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask about anime...">
        <button id="send-btn">➤</button>
    </div>
    
    <div class="branding">RR NETWORKS © POWERED BY ANIKING</div>

    <div id="account-modal">
        <div class="modal-content">
            <img id="modal-avatar" src="" alt="Avatar">
            <h3 id="modal-name" style="margin: 10px 0; font-family: 'Orbitron'; color: var(--accent-cyan);">---</h3>
            <p id="modal-email" style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">---</p>
            <button class="close-btn" onclick="toggleModal(false)">BACK TO CHAT</button>
        </div>
    </div>

    <script type="module">
        // Firebase Integration (Same config as your Login Page)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArqJycgZtlLpM7KQ2T9h-e2eJUHtMg-TY",
            authDomain: "tff-earns.firebaseapp.com",
            projectId: "tff-earns",
            storageBucket: "tff-earns.firebasestorage.app",
            messagingSenderId: "762695597074",
            appId: "1:762695597074:web:bd7a8df2df2806d5b26ccb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Detect User and Update Header
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const name = user.displayName || "Anime Fan";
                const photo = user.photoURL || "https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky";
                
                document.getElementById('header-name').innerText = name;
                document.getElementById('header-avatar').src = photo;
                
                // Set Modal Details
                document.getElementById('modal-name').innerText = name;
                document.getElementById('modal-email').innerText = user.email;
                document.getElementById('modal-avatar').src = photo;
            } else {
                window.location.href = "index.html"; // Redirect to login if not found
            }
        });
    </script>

    <script>
        // Chatbot Logic
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        const botBrain = {
            "who made you": "I was developed by **RR Networks** and I am powered by **ANIKING INDIA** technology!",
            "who is your creator": "My creators are the team at **RR Networks**, specifically for the **ANIKING** community.",
            "hello": "Kon'nichiwa! Ready to discuss some anime today?",
            "naruto": "Naruto is a masterpiece! Did you know Masashi Kishimoto originally didn't plan for Sasuke to exist?",
            "one piece": "One Piece is legendary! Luffy's journey to become the Pirate King is worth the watch."
        };

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function toggleModal(show) {
            document.getElementById('account-modal').style.display = show ? 'flex' : 'none';
        }

        sendBtn.onclick = () => {
            const text = userInput.value;
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            setTimeout(() => {
                const cleanInput = text.toLowerCase();
                let response = "That's an interesting doubt! Check the 'Trending' section for more info.";
                for (let key in botBrain) {
                    if (cleanInput.includes(key)) response = botBrain[key];
                }
                addMessage(response, 'bot');
            }, 800);
        };

        userInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };
    </script>
</body>
</html>
