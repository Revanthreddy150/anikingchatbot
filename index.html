<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIKING - AI Chat & Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 15, 0.98);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --bot-msg: #1a1a1a;
            --user-msg: #004d4d;
        }

        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark);
            margin: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Header Layout */
        .chat-header {
            background: var(--card-bg); padding: 10px 15px; border-bottom: 1px solid var(--accent-cyan);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 10px; }
        .chat-header h2 { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--accent-cyan); margin: 0; }

        .reload-btn { background: none; border: 1px solid #333; color: var(--accent-cyan); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }

        /* User Account Pill */
        .user-pill {
            display: flex; align-items: center; background: rgba(0, 242, 255, 0.1);
            padding: 4px 10px; border-radius: 20px; border: 1px solid var(--accent-cyan); cursor: pointer;
        }
        .user-pill img { width: 22px; height: 22px; border-radius: 50%; margin-right: 6px; }
        .user-pill span { font-size: 0.7rem; color: white; }

        /* Usage Badge in Header */
        #usage-timer { font-size: 0.6rem; color: #888; margin-top: 2px; display: block; }

        /* Chat Window */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #050505; }
        .message { max-width: 80%; padding: 12px; border-radius: 12px; font-size: 0.9rem; }
        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid #333; }
        .user { align-self: flex-end; background: var(--user-msg); border: 1px solid var(--accent-cyan); }

        /* Input Area */
        .input-area { padding: 15px; background: #0a0a0a; display: flex; gap: 10px; border-top: 1px solid #222; }
        #user-input { flex: 1; background: #151515; border: 1px solid #333; padding: 12px; border-radius: 25px; color: white; outline: none; }
        #send-btn { background: var(--accent-cyan); border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Profile Modal with Round Usage Box */
        #account-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--accent-cyan);
            text-align: center; width: 85%; max-width: 300px;
        }
        .modal-content img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent-cyan); }

        /* THE ROUNDED USAGE BOX */
        .usage-box {
            margin-top: 20px; padding: 15px; border-radius: 20px;
            background: rgba(0, 242, 255, 0.05); border: 1px dashed var(--accent-cyan);
        }
        .usage-box span { display: block; font-family: 'Orbitron'; color: var(--accent-cyan); font-size: 1.1rem; margin-top: 5px; }

        .close-btn { margin-top: 20px; background: var(--accent-cyan); color: #000; padding: 12px; border-radius: 8px; border: none; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="header-left">
            <button class="reload-btn" onclick="location.reload()">↻</button>
            <div>
                <h2>ANIKING AI</h2>
                <span id="usage-timer">Session: 0m 0s</span>
            </div>
        </div>
        
        <div class="user-pill" onclick="toggleModal(true)">
            <img id="header-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky">
            <span id="header-name">User</span>
        </div>
    </div>

    <div id="chat-window">
        <div class="message bot">Welcome! I'm tracking your training time today. How can I help?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type a message...">
        <button id="send-btn">SEND</button>
    </div>

    <div id="account-modal">
        <div class="modal-content">
            <img id="modal-avatar" src="">
            <h3 id="modal-name" style="color: var(--accent-cyan); margin: 10px 0;">---</h3>
            
            <div class="usage-box">
                <p style="font-size: 0.6rem; color: #888; text-transform: uppercase;">Total Chat Usage</p>
                <span id="total-usage-display">0m 0s</span>
            </div>

            <button class="close-btn" onclick="toggleModal(false)">BACK TO CHAT</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyArqJycgZtlLpM7KQ2T9h-e2eJUHtMg-TY",
            authDomain: "tff-earns.firebaseapp.com",
            projectId: "tff-earns",
            storageBucket: "tff-earns.firebasestorage.app",
            messagingSenderId: "762695597074",
            appId: "1:762695597074:web:bd7a8df2df2806d5b26ccb"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let startTime = Date.now();
        let totalSeconds = parseInt(localStorage.getItem('aniking_usage')) || 0;

        // Timer Logic
        setInterval(() => {
            let sessionSeconds = Math.floor((Date.now() - startTime) / 1000);
            let displayTotal = totalSeconds + sessionSeconds;

            // Update Header
            document.getElementById('usage-timer').innerText = `Session: ${formatTime(sessionSeconds)}`;
            
            // Update Modal Box
            document.getElementById('total-usage-display').innerText = formatTime(displayTotal);
            
            // Save to LocalStorage
            localStorage.setItem('aniking_usage', displayTotal);
        }, 1000);

        function formatTime(s) {
            let m = Math.floor(s / 60);
            let sec = s % 60;
            return `${m}m ${sec}s`;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('header-name').innerText = user.displayName || "User";
                document.getElementById('header-avatar').src = user.photoURL || "";
                document.getElementById('modal-name').innerText = user.displayName || "User";
                document.getElementById('modal-avatar').src = user.photoURL || "";
            } else {
                window.location.href = "index.html";
            }
        });
    </script>

    <script>
        // Chatbot Logic
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function toggleModal(show) { document.getElementById('account-modal').style.display = show ? 'flex' : 'none'; }

        sendBtn.onclick = () => {
            const val = userInput.value.trim();
            if (!val) return;

            // User Msg
            const uDiv = document.createElement('div');
            uDiv.className = 'message user';
            uDiv.innerText = val;
            chatWindow.appendChild(uDiv);
            userInput.value = '';

            // Bot Logic
            setTimeout(() => {
                const bDiv = document.createElement('div');
                bDiv.className = 'message bot';
                let reply = "I'm still learning! Ask about RR Networks or specific Anime.";
                
                if(val.toLowerCase().includes("who made you")) {
                    reply = "I was developed by **RR Networks** and I am powered by **ANIKING INDIA** technology!";
                }
                
                bDiv.innerHTML = reply;
                chatWindow.appendChild(bDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, 800);
        };
    </script>
</body>
</html>
