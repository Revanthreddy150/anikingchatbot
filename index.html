<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIKING - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 15, 0.98);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --bot-msg: #1a1a1a;
            --user-msg: #004d4d;
        }

        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark);
            margin: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Header Layout */
        .chat-header {
            background: var(--card-bg); padding: 10px 15px; border-bottom: 1px solid var(--accent-cyan);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .reload-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            color: var(--accent-cyan); padding: 8px; border-radius: 50%;
            cursor: pointer; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: 0.3s;
        }
        .reload-btn:active { transform: rotate(180deg); background: var(--accent-cyan); color: #000; }

        .chat-header h2 { font-family: 'Orbitron'; font-size: 0.85rem; color: var(--accent-cyan); margin: 0; }

        /* User Account Pill */
        .user-pill {
            display: flex; align-items: center; background: rgba(0, 242, 255, 0.1);
            padding: 4px 10px; border-radius: 20px; border: 1px solid var(--accent-cyan);
            cursor: pointer;
        }
        .user-pill img { width: 22px; height: 22px; border-radius: 50%; margin-right: 6px; }
        .user-pill span { font-size: 0.7rem; font-weight: bold; color: white; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Chat Window */
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            background: radial-gradient(circle at center, #0a1114 0%, #050505 100%);
        }

        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid #333; border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--user-msg); border: 1px solid var(--accent-cyan); border-bottom-right-radius: 2px; }

        /* Input Area */
        .input-area { padding: 15px; background: #0a0a0a; display: flex; gap: 10px; border-top: 1px solid #222; }
        #user-input { flex: 1; background: #151515; border: 1px solid #333; padding: 12px; border-radius: 25px; color: white; outline: none; }
        #send-btn { background: var(--accent-cyan); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .branding { font-size: 0.55rem; color: #555; text-align: center; padding: 5px; background: #000; letter-spacing: 1px; }

        /* Account Modal Overlay */
        #account-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--accent-cyan);
            text-align: center; width: 85%; max-width: 320px; box-shadow: 0 0 30px var(--accent-cyan);
        }
        .modal-content img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent-cyan); margin-bottom: 15px; }
        .close-btn { margin-top: 25px; background: var(--accent-cyan); color: #000; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="header-left">
            <button class="reload-btn" onclick="location.reload()" title="Restart Chat">↻</button>
            <h2>ANIKING AI</h2>
        </div>
        
        <div class="user-pill" id="profile-trigger" onclick="toggleModal(true)">
            <img id="header-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky" alt="U">
            <span id="header-name">User</span>
        </div>
    </div>

    <div id="chat-window">
        <div class="message bot">Welcome back to **ANIKING INDIA**! 🥷 How can I help with your anime doubts today?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your doubt...">
        <button id="send-btn">SEND</button>
    </div>
    
    <div class="branding">RR NETWORKS © POWERED BY ANIKING</div>

    <div id="account-modal">
        <div class="modal-content">
            <img id="modal-avatar" src="" alt="Avatar">
            <h3 id="modal-name" style="margin: 10px 0; font-family: 'Orbitron'; color: var(--accent-cyan);">---</h3>
            <p id="modal-email" style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">User Database Active</p>
            <p id="modal-email-text" style="font-size: 0.75rem; color: #555;">---</p>
            <button class="close-btn" onclick="toggleModal(false)">CLOSE PROFILE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArqJycgZtlLpM7KQ2T9h-e2eJUHtMg-TY",
            authDomain: "tff-earns.firebaseapp.com",
            projectId: "tff-earns",
            storageBucket: "tff-earns.firebasestorage.app",
            messagingSenderId: "762695597074",
            appId: "1:762695597074:web:bd7a8df2df2806d5b26ccb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // SYNC USER DATA
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const name = user.displayName || "Anime Master";
                const photo = user.photoURL || "https://api.dicebear.com/7.x/adventurer/svg?seed=Lucky";
                
                document.getElementById('header-name').innerText = name;
                document.getElementById('header-avatar').src = photo;
                
                document.getElementById('modal-name').innerText = name;
                document.getElementById('modal-email-text').innerText = user.email;
                document.getElementById('modal-avatar').src = photo;
            } else {
                window.location.href = "index.html"; 
            }
        });
    </script>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        const botBrain = {
            "who made you": "I was developed by **RR Networks** and I am powered by **ANIKING INDIA** technology!",
            "who is your creator": "My creators are the team at **RR Networks**, specifically for the **ANIKING** community.",
            "hi": "Kon'nichiwa! Ready to explore the anime world?",
            "naruto": "Believe it! Naruto Uzumaki is the Seventh Hokage and a legend in the leaf village.",
            "solo leveling": "Sung Jin-woo's leveling system is unique. Arise!",
            "help": "I can answer questions about your favorite shows or who built this awesome app!"
        };

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        window.toggleModal = function(show) {
            document.getElementById('account-modal').style.display = show ? 'flex' : 'none';
        };

        sendBtn.onclick = () => {
            const text = userInput.value;
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            setTimeout(() => {
                const cleanInput = text.toLowerCase();
                let response = "That's an interesting anime doubt! Check the 'Trending' section of **ANIKING** for more details.";
                for (let key in botBrain) {
                    if (cleanInput.includes(key)) response = botBrain[key];
                }
                addMessage(response, 'bot');
            }, 800);
        };

        userInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };
    </script>
</body>
</html>
